<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lab Científico</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{background:#0b1020;color:white;font-family:Arial;margin:0}
header{padding:15px;text-align:center;background:#111}
.card{background:#111;margin:10px;padding:15px;border-radius:10px}
button{background:#7aa2ff;border:none;padding:10px;color:black;border-radius:8px;margin:5px}
input,select{width:100%;padding:6px;margin:2px}
</style>
</head>

<body>

<header>
<h1>📊 Lab Científico PIBIC</h1>
</header>

<div class="card">
<h3>📊 Progresso</h3>
<div style="background:#333;height:20px;border-radius:10px">
<div id="progresso" style="height:100%;width:0%;background:#7aa2ff"></div>
</div>
<p id="textoProgresso"></p>
</div>

<div class="card">
<h3>📥 Dados</h3>
<table width="100%">
<thead>
<tr>
<th>Tema</th><th>Autor</th><th>Likes</th><th>Com</th><th>Env</th><th>Salv</th><th>Alc</th><th></th>
</tr>
</thead>
<tbody id="tabelaDados"></tbody>
</table>

<button onclick="addRow()">➕ Linha</button>
<button onclick="salvar()">💾 Salvar</button>
</div>

<div class="card">
<h3>📊 Estatísticas</h3>
<div id="stats"></div>
</div>

<canvas id="grafico"></canvas>

<div class="card">
<h3>🤖 Orientador</h3>
<div id="orientador"></div>
</div>

<div class="card">
<button onclick="instalarApp()">📲 Baixar App</button>
</div>

<script src="app.js"></script>

</body>
</html>
