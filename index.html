<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lab Científico PIBIC PRO</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{background:#0d1117;color:#c9d1d9;font-family:Arial}
.card{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:16px;margin-bottom:16px}
input{background:#0d1117;border:1px solid #21262d;padding:8px;border-radius:6px;color:white;width:100%}
button{background:#6390ff;padding:8px;border-radius:6px;color:white}
.hidden{display:none}
</style>
</head>

<body class="p-4 max-w-5xl mx-auto">

<h1 class="text-2xl mb-4 font-bold">🧠 Lab Científico PIBIC PRO</h1>

<!-- LOGIN -->
<div class="card">
<h2>🔒 Área do Orientador</h2>
<input id="senha" placeholder="Digite a senha">
<button onclick="login()">Entrar</button>
</div>

<!-- PROGRESSO -->
<div class="card">
<h2>Progresso</h2>
<div style="background:#222;height:10px;border-radius:5px">
<div id="progress" style="height:10px;background:#6390ff;width:0%"></div>
</div>
</div>

<!-- FORM -->
<div class="card">
<h2>Entrada de Dados</h2>
<div class="grid grid-cols-2 gap-2">
<input id="tema" placeholder="Tema">
<input id="autor" placeholder="Autor">
<input id="curtidas" type="number" placeholder="Curtidas">
<input id="comentarios" type="number" placeholder="Comentários">
<input id="comp" type="number" placeholder="Compartilhamentos">
<input id="salvos" type="number" placeholder="Salvos">
<input id="alcance" type="number" placeholder="Alcance">
<button onclick="add()">Adicionar</button>
</div>
</div>

<!-- TABELA -->
<div class="card">
<h2>Dados</h2>
<table class="w-full text-sm">
<tbody id="tabela"></tbody>
</table>
</div>

<!-- STATS -->
<div class="card">
<h2>Estatísticas</h2>
<p id="stats"></p>
</div>

<!-- GRÁFICO -->
<div class="card">
<canvas id="grafico"></canvas>
</div>

<!-- ORIENTADOR -->
<div class="card">
<h2>Orientador</h2>
<p id="advisor"></p>
</div>

<!-- ARTIGO OCULTO -->
<div id="artigoArea" class="card hidden">
<h2>📄 Artigo Científico Automático</h2>

<div id="artigoTexto" style="background:white;color:black;padding:20px"></div>

<button onclick="baixarPDF()">📥 Baixar PDF</button>
</div>

<script>

let dados = JSON.parse(localStorage.getItem("dados")||"[]");
let chart;

// LOGIN
function login(){
if(senha.value==="prof2026"){
artigoArea.classList.remove("hidden");
gerarArtigo();
}else{
alert("Senha incorreta");
}
}

// ADD
function add(){

let d={
tema:tema.value,
autor:autor.value,
curtidas:+curtidas.value,
comentarios:+comentarios.value,
comp:+comp.value,
salvos:+salvos.value,
alcance:+alcance.value
};

d.eng=(d.curtidas+d.comentarios+d.comp+d.salvos)/(d.alcance||1);

dados.push(d);

localStorage.setItem("dados",JSON.stringify(dados));

render();
}

// DELETE
function del(i){
dados.splice(i,1);
localStorage.setItem("dados",JSON.stringify(dados));
render();
}

// MÉDIA
function media(arr){return arr.reduce((a,b)=>a+b,0)/arr.length}

// DESVIO
function desvio(arr){
let m=media(arr);
return Math.sqrt(arr.reduce((s,v)=>s+(v-m)**2,0)/(arr.length-1))
}

// REGRESSÃO
function regressao(x,y){
let n=x.length;
let sumX=x.reduce((a,b)=>a+b,0);
let sumY=y.reduce((a,b)=>a+b,0);
let sumXY=x.reduce((s,v,i)=>s+v*y[i],0);
let sumX2=x.reduce((s,v)=>s+v*v,0);

let a=(n*sumXY-sumX*sumY)/(n*sumX2-sumX**2);
let b=(sumY-a*sumX)/n;

return {a,b};
}

// P-VALUE
function pvalue(t){
return Math.exp(-0.717*t-0.416*t*t);
}

// RENDER
function render(){

tabela.innerHTML="";
dados.forEach((d,i)=>{
tabela.innerHTML+=`
<tr>
<td>${d.tema}</td>
<td>${d.autor}</td>
<td>${(d.eng*100).toFixed(2)}%</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;
});

if(dados.length>0){

let eng=dados.map(d=>d.eng);
let m=media(eng);
let dp=desvio(eng);
let t=Math.abs(m/(dp||1));
let p=pvalue(t);

stats.innerHTML=`
Média: ${(m*100).toFixed(2)}%<br>
Desvio: ${(dp*100).toFixed(2)}%<br>
p-value: ${p.toFixed(4)}
`;

}

// gráfico
if(chart) chart.destroy();

if(dados.length>0){

let x=dados.map((_,i)=>i+1);
let y=dados.map(d=>d.eng);

let {a,b}=regressao(x,y);
let pred=x.map(v=>a*v+b);

chart=new Chart(grafico,{
type:'line',
data:{
labels:x,
datasets:[
{label:'Engajamento',data:y},
{label:'Tendência',data:pred}
]
}
});

}

// orientador
if(dados.length<5) advisor.innerText="Colete mais dados";
else if(dados.length<10) advisor.innerText="Análise preliminar";
else advisor.innerText="Pronto para artigo";

progress.style.width=Math.min(100,dados.length*10)+"%";

}

// ARTIGO AUTOMÁTICO
function gerarArtigo(){

if(dados.length===0) return;

let eng=dados.map(d=>d.eng);
let m=media(eng).toFixed(3);
let dp=desvio(eng).toFixed(3);

artigoTexto.innerHTML=`
<h2>RESULTADOS</h2>
<p>Foram analisadas ${dados.length} publicações. A média de engajamento foi de ${m}, com desvio padrão de ${dp}.</p>

<h2>DISCUSSÃO</h2>
<p>Os dados indicam que o engajamento apresenta variação ${dp>m?"elevada":"moderada"}, sugerindo ${dp>m?"heterogeneidade":"consistência"} nas interações do público.</p>

<h2>CONCLUSÃO</h2>
<p>O uso do Instagram mostrou-se uma ferramenta relevante para educação em saúde.</p>
`;
}

// PDF
function baixarPDF(){
html2pdf().from(artigoTexto).save("artigo.pdf");
}

// INIT
render();

</script>

</body>
</html>
