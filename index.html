<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lab Científico PIBIC PRO</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f7cff">

<!-- IOS -->
<link rel="apple-touch-icon" href="icons/icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  background:#0a0e1a;
  color:#c4cde0;
  font-family:Arial;
  padding:20px;
}
.card{
  background:#131829;
  padding:20px;
  border-radius:12px;
  margin-bottom:15px;
}
input,select{
  width:100%;
  padding:8px;
  margin:4px 0;
}
button{
  margin:5px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#4f7cff;
  color:white;
  cursor:pointer;
}
h1,h2{color:white;}
canvas{background:white;border-radius:10px;}
pre{white-space:pre-wrap;}
.install-btn{
  background:#10b981;
}
</style>
</head>

<body>

<h1>🧪 Lab Científico PIBIC PRO</h1>

<button id="installBtn" class="install-btn" style="display:none">
📱 Instalar App
</button>

<!-- FORM -->
<div class="card">
<h2>Novo Registro</h2>

<select id="tipo">
<option>Reel</option>
<option>Carrossel</option>
<option>Story</option>
<option>Estático</option>
</select>

<select id="tema">
<option>IST</option>
<option>Prevenção</option>
<option>Educação</option>
</select>

<input id="curtidas" type="number" placeholder="Curtidas">
<input id="comentarios" type="number" placeholder="Comentários">
<input id="comp" type="number" placeholder="Compartilhamentos">
<input id="salvos" type="number" placeholder="Salvos">
<input id="alcance" type="number" placeholder="Alcance">

<button onclick="add()">Adicionar</button>
<button onclick="analisar()">Analisar</button>
</div>

<!-- AÇÕES -->
<div class="card">
<h2>Ações Científicas</h2>

<button onclick="gerarArtigoABNT()">📄 Artigo ABNT</button>
<button onclick="anova()">🔬 ANOVA</button>
<button onclick="interpretacao()">🤖 IA Científica</button>
<button onclick="exportarCSV()">💾 CSV</button>
</div>

<!-- ESTATÍSTICAS -->
<div class="card">
<h2>Estatísticas</h2>
<p>Média: <span id="mean"></span></p>
<p>Desvio padrão: <span id="std"></span></p>
<p>Coeficiente de variação: <span id="cv"></span></p>
<p>Mediana: <span id="median"></span></p>
<p>Quartis: <span id="quart"></span></p>
</div>

<!-- DASHBOARD -->
<div class="card">
<h2>Dashboard</h2>
<canvas id="g1"></canvas>
<canvas id="g2"></canvas>
</div>

<!-- TEXTO -->
<div class="card">
<h2>Resultado Científico</h2>
<pre id="texto"></pre>
</div>

<script>

let data = JSON.parse(localStorage.getItem("dados")||"[]");
function save(){localStorage.setItem("dados",JSON.stringify(data));}

function eng(d){
return (d.curtidas+d.comentarios+d.comp+d.salvos)/d.alcance*100;
}

function avg(a){return a.reduce((x,y)=>x+y,0)/a.length;}

function std(a){
let m=avg(a);
return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1));
}

function median(a){
let s=[...a].sort((a,b)=>a-b);
let m=Math.floor(s.length/2);
return s.length%2?s[m]:(s[m-1]+s[m])/2;
}

function quartis(a){
let s=[...a].sort((a,b)=>a-b);
return{
q1:s[Math.floor(s.length/4)],
q3:s[Math.floor(3*s.length/4)]
};
}

function add(){
data.push({
tipo:tipo.value,
tema:tema.value,
curtidas:+curtidas.value,
comentarios:+comentarios.value,
comp:+comp.value,
salvos:+salvos.value,
alcance:+alcance.value
});
save();
alert("Adicionado");
}

function analisar(){

if(data.length<2){alert("Adicione mais dados");return;}

let r=data.map(eng);

let m=avg(r);
let s=std(r);
let cv=(s/m)*100;
let med=median(r);
let q=quartis(r);

mean.innerText=m.toFixed(2)+"%";
std.innerText=s.toFixed(2);
cv.innerText=cv.toFixed(2)+"%";
median.innerText=med.toFixed(2);
quart.innerText=q.q1.toFixed(2)+" / "+q.q3.toFixed(2);

new Chart(g1,{
type:"bar",
data:{labels:data.map((_,i)=>"Post "+(i+1)),datasets:[{label:"Engajamento",data:r}]}
});

let tipos=[...new Set(data.map(d=>d.tipo))];
let medias=tipos.map(t=>avg(data.filter(d=>d.tipo===t).map(eng)));

new Chart(g2,{
type:"bar",
data:{labels:tipos,datasets:[{label:"Média por Tipo",data:medias}]}
});
}

function anova(){
let grupos={};

data.forEach(d=>{
if(!grupos[d.tipo])grupos[d.tipo]=[];
grupos[d.tipo].push(eng(d));
});

let todos=Object.values(grupos).flat();
let mediaTotal=avg(todos);

let ssBetween=0;
let ssWithin=0;

Object.values(grupos).forEach(g=>{
let m=avg(g);
ssBetween+=g.length*(m-mediaTotal)**2;
g.forEach(v=>ssWithin+=(v-m)**2);
});

let F=ssBetween/ssWithin;

alert("F = "+F.toFixed(3));
}

function gerarArtigoABNT(){
let r=data.map(eng);
let m=avg(r);
let s=std(r);

texto.innerText=
`RESULTADOS

Média: ${m.toFixed(2)}%
DP: ${s.toFixed(2)}

DISCUSSÃO

Resultados indicam padrão de engajamento digital.`;
}

function interpretacao(){
let r=data.map(eng);
let m=avg(r);
let cv=(std(r)/m)*100;

texto.innerText=
`Análise automática:

Média ${m.toFixed(2)}%
CV ${cv.toFixed(2)}%

${cv<20?"Alta consistência":"Alta variabilidade"}`;
}

function exportarCSV(){
let csv="tipo,tema,eng\n";
data.forEach(d=>csv+=`${d.tipo},${d.tema},${eng(d)}\n`);

let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="dados.csv";
a.click();
}

// ===== INSTALL PWA =====
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", e=>{
e.preventDefault();
deferredPrompt=e;
installBtn.style.display="block";
});

installBtn.onclick=()=>{
deferredPrompt.prompt();
deferredPrompt.userChoice.then(()=>deferredPrompt=null);
};

// ===== SERVICE WORKER =====
if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}

// ===== EXEMPLO =====
if(data.length===0){
data=[
{tipo:"Reel",tema:"IST",curtidas:120,comentarios:30,comp:20,salvos:40,alcance:2000},
{tipo:"Carrossel",tema:"Educação",curtidas:80,comentarios:10,comp:10,salvos:20,alcance:1500}
];
save();
}

</script>

</body>
</html>
